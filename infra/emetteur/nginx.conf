# Porte d’entrée publique des flux (port 8000) : répond aux navigateurs (CORS),
# relaie les flux d’Icecast sans tampon et ferme l’administration.
worker_processes auto;
pid /tmp/onde-nginx.pid;
error_log stderr warn;
events { worker_connections 8192; }
http {
  access_log off;
  server {
    listen 8000;
    location /admin { return 403; }
    location = / { return 200 "Onde : emetteur en service\n"; }
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "Icy-MetaData";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Private-Network "true";
        add_header Access-Control-Max-Age 86400;
        return 204;
      }
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1d;
      proxy_set_header Host $host;
      proxy_set_header Icy-MetaData $http_icy_metadata;
    }
  }
}
