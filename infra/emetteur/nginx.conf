# Porte d’entrée publique des flux (port 8000) : répond aux navigateurs (CORS),
# relaie les flux d’Icecast sans tampon, sert la bibliothèque musicale et ferme l’administration.
# Modèle : entrypoint.sh remplace @SECRET@ et @BIBLIOTHEQUE@ avant de démarrer nginx.
worker_processes auto;
pid /tmp/onde-nginx.pid;
error_log stderr warn;
events { worker_connections 8192; }
http {
  access_log off;
  server {
    listen 8000;
    location /admin { return 403; }
    location = / { return 200 "Onde : emetteur en service\n"; }

    # Bibliothèque musicale : lecture, dépôt et suppression uniquement avec un lien signé par Onde,
    # qui expire. Signature : md5(<expiration><méthode><chemin> <secret>), le secret étant
    # l’empreinte SHA-256 de la clé de l’émetteur (Onde la connaît sans connaître la clé).
    location ^~ /titres/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Range";
        add_header Access-Control-Allow-Private-Network "true";
        add_header Access-Control-Max-Age 86400;
        return 204;
      }
      secure_link $arg_s,$arg_e;
      secure_link_md5 "$secure_link_expires$request_method$uri @SECRET@";
      if ($secure_link = "") { return 403; }
      if ($secure_link = "0") { return 410; }
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
      alias @BIBLIOTHEQUE@/;
      types {
        audio/mpeg mp3;
        audio/mp4 m4a;
        audio/aac aac;
        audio/wav wav;
        audio/flac flac;
        audio/ogg ogg opus;
        audio/aiff aif aiff;
      }
      dav_methods PUT DELETE;
      create_full_put_path off;
      dav_access user:rw group:r all:r;
      client_max_body_size 300m;
      client_body_temp_path @BIBLIOTHEQUE@/.envoi;
    }
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "Icy-MetaData";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Private-Network "true";
        add_header Access-Control-Max-Age 86400;
        return 204;
      }
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1d;
      proxy_set_header Host $host;
      proxy_set_header Icy-MetaData $http_icy_metadata;
    }
  }
}
